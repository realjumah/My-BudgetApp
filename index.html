<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Budget</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--tx:#14211f;--mut:#5b6b68;--pri:#0f766e;--on:#fff;--inc:#15803d;--exp:#c2410c;--warn:#b45309;--bd:#d9e3e1}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17211f;--tx:#e6efed;--mut:#93a5a1;--pri:#2dd4bf;--on:#06201c;--inc:#4ade80;--exp:#fb923c;--warn:#fbbf24;--bd:#2a3a37}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
button{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--on);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}header input{width:auto;margin:0;padding:6px 8px}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}.mut{color:var(--mut);font-size:14px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:15px}.grid span{font-size:12px;color:var(--mut)}
.inc{color:var(--inc)}.exp{color:var(--exp)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0}
input,select,textarea{width:100%;margin-top:4px;padding:11px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.btn{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:var(--pri);color:var(--on);font-weight:600;font-size:16px;cursor:pointer}
.btn.ghost{background:none;color:var(--pri);border:1px solid var(--pri)}.btn.red{background:none;color:var(--exp);border:1px solid var(--exp)}
.seg,.row{display:flex;gap:8px}.row>*{flex:1}
.seg button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.seg button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.cat{margin:12px 0}.cat div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--pri)}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--exp)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}.tx small{display:block;color:var(--mut)}.tx button{background:none;border:0;color:var(--mut);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:7px 10px;border:1px solid var(--pri);border-radius:16px;background:none;color:var(--pri);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0;border:0;background:none;color:var(--mut);font-size:10px}nav button span{display:block;font-size:19px}nav button.on{color:var(--pri);font-weight:700}
#fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;border:0;background:var(--pri);color:var(--on);font-size:22px;z-index:6;box-shadow:0 2px 8px #0005}
.mod{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.cdisp{font-size:30px;text-align:right;word-break:break-all;min-height:42px;padding:4px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:18px}
.keys .op{background:var(--pri);color:var(--on)}.keys .w{grid-column:span 2}
.hero{background:linear-gradient(135deg,#0f766e,#14532d 70%,#365314);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 6px 18px #0f766e44}
.hero small{opacity:.85}.hero h2{margin:2px 0 0;font-size:32px;letter-spacing:-.5px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pills div{background:#ffffff26;border-radius:12px;padding:10px;font-size:13px}.pills b{display:block;font-size:16px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 2px;color:var(--tx);font-size:12px}.qa span{display:block;font-size:22px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kp div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:14px;padding:12px}.kp small{color:var(--mut);display:block;font-size:12px}.kp b{font-size:16px}
.flex{display:flex;align-items:center;gap:14px}.leg{flex:1;font-size:13px}.leg div{display:flex;justify-content:space-between;gap:6px;margin:5px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.go{cursor:pointer}.go:active{opacity:.7}.tx.hl{background:#f59e0b33;border-radius:8px;padding-left:8px;padding-right:8px}
</style>
</head>
<body>
<header><h1>💰 My Budget</h1><input type="month" id="month" aria-label="Month"></header>
<main id="view"></main>
<button id="fab" onclick="calc(1)" aria-label="Calculator">🧮</button>
<div id="cw" class="mod" hidden onclick="if(event.target===this)calc(0)"><div class="card" style="width:100%;max-width:420px;margin:0">
<div id="cdisp" class="cdisp">0</div><div id="cr" class="mut" style="text-align:right;min-height:20px"></div>
<div class="keys" id="ck"></div>
<div class="row"><button class="btn" onclick="useCalc()">Use as amount</button><button class="btn ghost" onclick="calc(0)">Close</button></div></div></div>
<div id="dg" class="mod" hidden style="align-items:center;z-index:30" onclick="if(event.target===this)dgx(0)"><div class="card" style="width:100%;max-width:380px;margin:0">
<p id="dm" style="font-size:17px;margin:6px 0 16px;white-space:pre-line"></p>
<div class="row"><button class="btn ghost" id="dn" onclick="dgx(0)">Cancel</button><button class="btn" id="dy" onclick="dgx(1)">OK</button></div></div></div>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>Home</button>
<button data-t="add" onclick="go('add')"><span>➕</span>Add</button>
<button data-t="history" onclick="go('history')"><span>📋</span>History</button>
<button data-t="budgets" onclick="go('budgets')"><span>🎯</span>Budgets</button>
<button data-t="journal" onclick="go('journal')"><span>📓</span>Journal</button>
<button data-t="ai" onclick="go('ai')"><span>🤖</span>Ask</button>
<button data-t="more" onclick="go('more')"><span>⚙️</span>More</button>
</nav>
<script>
const K='budget-pwa-v1',$=s=>document.querySelector(s),pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const nowT=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const DEF={cur:'UGX',tx:[],budgets:{},journal:[],who:{Education:['Awwal Juma','Akbar Juma','Maira Juma','Others']},
 cats:{expense:[
 'Housing & Accommodation','Food & Groceries','Transport','Utilities & Communication','Electronics & Technology',
 'Education','Clothing','Healthcare','Household Supplies',
 'Personal Care & Development','Family Responsibilities','Islamic Obligations & Charity',
 'Social Obligations','Debt Repayment','Savings & Emergency Fund',
 'Investments & Wealth Creation','Recreation & Entertainment','Miscellaneous & Unexpected'
 ],
 income:[
 'Salary/Wages','Business Withdrawal','Project/Field Allowance','Farming & Livestock',
 'Casual Work','Rental Income','Gifts/Family Support','Refunds/Reimbursements','Other Income'
 ]},
 subs:{
 'Food & Groceries':['Posho & maize flour','Cassava flour & millet','Beans & rice','Ingredients, spices & essentials','Meat & fish','Chicken & eggs','Vegetables & fruits','Milk, bread & snacks','Assorted food','Eating out','Other'],
 'Transport':['Boda boda','Taxi & bus fares','Fuel','Vehicle repairs','Parking','Long-distance travel','Other'],
 'Utilities & Communication':['Electricity','Water','Charcoal/firewood/gas','Airtime','Internet bundles','Mobile money charges','Other'],
 'Education':['School fees','Uniforms & shoes','Books & stationery','Tour fees','School transport','Madrasa','Other'],
 'Clothing':['Adult clothing','Children clothing','Shoes','Work clothes','Islamic clothing','Tailoring & repairs','Other'],
 'Healthcare':['Clinic & hospital','Medicines','Dental care','Eye care','Laboratory tests','Emergency treatment','Other'],
 'Household Supplies':['Soap & detergents','Toilet paper & toiletries','Cleaning materials','Cooking utensils','Bedding & towels','Cosmetics','Deodorants','Other'],
 'Personal Care & Development':['Haircuts & grooming','Gym & fitness','Books','Online courses','Professional training','Computer/software','Other'],
 'Family Responsibilities':['Household support','Childcare','Relatives support','Family visits','Family emergencies','Other'],
 'Islamic Obligations & Charity':['Zakat','Sadaqah','Mosque contributions','Zakatul Fitr','Ramadan expenses','Eid celebrations','Support to needy people','Other'],
 'Social Obligations':['Weddings','Funerals & burial contributions','Community contributions','Visitors & hospitality','Traditional family obligations','Other'],
 'Debt Repayment':['Personal loan','SACCO loan','VSLA loans','Telecom loans','Other debt','Other'],
 'Savings & Emergency Fund':['Emergency fund','School fees savings','Medical savings','House construction savings','Family future savings','Other'],
 'Investments & Wealth Creation':['Land','Livestock','Agriculture','Long-term investment','Income-generating project','Retirement savings','Other'],
 'Recreation & Entertainment':['Family outings','Sports & hobbies','Subscriptions','Holiday trips','Personal leisure','Other'],
 'Housing & Accommodation':['Rent','House construction','Repairs & maintenance','Compound cleaning','Security','Furniture & improvements','Other'],
 'Miscellaneous & Unexpected':['Unexpected travel','Emergency repairs','Unplanned family needs','Other'],
 'Electronics & Technology':['Phones','Computers & laptops','Computer accessories','Phone accessories','Laptop repairs','Phone repairs','Software & applications','Internet equipment','Other electronics'],
 'Agric':['Buying seeds','Buying drugs','Feeds','Fungicides/insecticides','Buying livestock/poultry','Ploughing','Weeding','Harvesting','Other'],
 'School Fees':['Awwal Juma','Akbar Juma','Maira Juma','Other']
 }};
// Adds any new categories to data saved earlier, so old entries are kept
const norm=d=>{const s=Object.assign(structuredClone(DEF),d||{});
 // "Education & Children" is now "Education"; "Examination fees" is now "Tour fees" (old entries keep their labels)
 const O='Education & Children',N='Education';
 s.cats.expense=[...new Set(s.cats.expense.map(c=>c===O?N:c))];
 if(s.subs[O]){s.subs[N]=[...new Set([...(s.subs[N]||[]),...s.subs[O]])];delete s.subs[O]}
 if(s.subs[N])s.subs[N]=s.subs[N].map(u=>u==='Examination fees'?'Tour fees':u).filter((u,i,a)=>a.indexOf(u)===i);
 s.tx.forEach(t=>{if(t.cat===O)t.cat=N});(s.journal||[]).forEach(j=>{if(j.topic===O)j.topic=N});
 for(const k of Object.keys(s.budgets))if(k===O||k.startsWith(O+' › ')){s.budgets[N+k.slice(O.length)]=s.budgets[k];delete s.budgets[k]}
 // one-time: the 14 old starter categories are removed (new categories stay; "Transport" is in both lists)
 if(!s.m1){const OLD=['Food','Rent','Airtime & Data','Health','School Fees','Business','Savings','Entertainment','Sadaqa','Contributions','Debt Payment','Saloon','Agric','Other'];s.cats.expense=s.cats.expense.filter(c=>!OLD.includes(c));s.m1=1}
 // one-time: entries saved under the old starter categories are moved to the matching new category (the old label is kept in t.was)
 if(!s.m2){const MAP={'Food':['Food & Groceries'],'Rent':['Housing & Accommodation','Rent'],'Airtime & Data':['Utilities & Communication','Airtime'],'Health':['Healthcare'],'School Fees':['Education','School fees'],'Business':['Investments & Wealth Creation','Income-generating project'],'Savings':['Savings & Emergency Fund'],'Entertainment':['Recreation & Entertainment'],'Sadaqa':['Islamic Obligations & Charity','Sadaqah'],'Contributions':['Social Obligations','Community contributions'],'Debt Payment':['Debt Repayment'],'Saloon':['Personal Care & Development','Haircuts & grooming'],'Agric':['Investments & Wealth Creation','Agriculture'],'Other':['Miscellaneous & Unexpected']};
  s.who=s.who||{};const wl=s.who.Education=s.who.Education||['Others'];
  s.tx.forEach(t=>{const m=MAP[t.cat];if(t.type!=='expense'||!m)return;t.was=t.cat+(t.sub?' › '+t.sub:'');
   if(t.cat==='School Fees'){t.who=t.sub==='Other'?'Others':t.sub||'';if(t.who&&!wl.includes(t.who)){const i=wl.indexOf('Others');i<0?wl.push(t.who):wl.splice(i,0,t.who)}}
   else if(t.cat==='Agric'&&t.sub)t.note=t.sub+(t.note?'. '+t.note:'');
   t.cat=m[0];t.sub=m[1]||''});
  (s.journal||[]).forEach(j=>{const m=!['Business','Savings','Other'].includes(j.topic)&&MAP[j.topic];if(!m)return;if(j.sub)j.text='['+j.sub+'] '+j.text;j.topic=m[0];j.sub=m[1]||''});
  for(const o in MAP){if(s.budgets[o]===undefined)continue;const nk=MAP[o][0]+(MAP[o][1]?' › '+MAP[o][1]:'');if(!s.budgets[nk])s.budgets[nk]=s.budgets[o];delete s.budgets[o]}
  s.m2=1}
 // food items: "Meat, fish & eggs" is now "Meat & fish"; "Cooking oil & essentials" is now "Ingredients, spices & essentials"
 const F='Food & Groceries',FR={'Meat, fish & eggs':'Meat & fish','Cooking oil & essentials':'Ingredients, spices & essentials'};
 if(s.subs[F]){s.subs[F]=s.subs[F].map(u=>FR[u]||u).filter((u,i,a)=>a.indexOf(u)===i);
  for(const o in FR){const ok=F+' › '+o,nk=F+' › '+FR[o];if(s.budgets[ok]!==undefined){if(!s.budgets[nk])s.budgets[nk]=s.budgets[ok];delete s.budgets[ok]}}}
 for(const k in DEF.cats)DEF.cats[k].forEach(c=>s.cats[k].includes(c)||s.cats[k].push(c));
 s.cats.income=s.cats.income.filter(c=>c!=='Gift');
 s.tx.forEach(t=>{if(t.type==='income'&&t.cat==='Gift')t.cat='Gifts/Donations'});
 s.subs=Object.assign({},DEF.subs,s.subs);
 for(const k in DEF.subs)DEF.subs[k].forEach(u=>{if(!s.subs[k].includes(u)){const i=s.subs[k].indexOf('Other');i<0?s.subs[k].push(u):s.subs[k].splice(i,0,u)}});return s};
let S;try{S=norm(JSON.parse(localStorage.getItem(K)))}catch(e){S=norm()}
try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
let tab='home',month=today().slice(0,7),addType='expense',flt='all',fcat='',per='month',hq='',hv='list',sp='day',jq='',jf='',jp='month',jm=true,jedit=null,tedit=null,hlId=0,chat=[],ex='',inst=null;

let G={};try{G=JSON.parse(localStorage.getItem('budget-gdrive'))||{}}catch(e){}
const saveG=()=>{try{localStorage.setItem('budget-gdrive',JSON.stringify(G))}catch(e){}};
const save=()=>{localStorage.setItem(K,JSON.stringify(S));if(G.on){G.d=1;saveG()}};
const ad=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate())};
const wk=d=>ad(d,-((new Date(d+'T00:00:00').getDay()+6)%7));
const fd=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const EX={'Phones':'smartphone purchases','Computers & laptops':'new laptop or desktop','Computer accessories':'mouse, keyboard, flash disk, charger','Phone accessories':'phone cover, screen protector, earphones','Laptop repairs':'screen, keyboard, motherboard repairs','Phone repairs':'screen or battery replacement','Software & applications':'paid software, subscriptions','Internet equipment':'router, modem, MiFi','Other electronics':'other electronic devices','Telecom loans':'e.g. MoMo loans','Ingredients, spices & essentials':'salt, onions, tomatoes, cooking oil'};
const sOpts=l=>l.map(u=>EX[u]?[u,u+' ('+EX[u]+')']:u);
const subLbl=c=>c==='School Fees'?'Child (who is the fee for?)':'Item (what is it for?)';
const goAdd=t=>{tedit=null;addType=t;go('add')};
const txRow=(x,d)=>`<div class="tx${x.id===hlId?' hl':''}" id="e${x.id}"><div><b>${esc(x.cat)}${x.sub?' › '+esc(x.sub):''}</b><small>${x.date}${x.time?' '+x.time:''}${x.who?' · 👤 '+esc(x.who):''}${x.note?' · '+esc(x.note):''}</small></div><b class=${x.type==='income'?'inc':'exp'}>${x.type==='income'?'+':'−'}${fmt(x.amt)}</b>${d?`<span style="display:flex;flex-direction:column"><button onclick="editTx(${x.id})" aria-label="Edit entry">✏️</button><button onclick="del(${x.id})" aria-label="Delete entry">🗑</button></span>`:''}</div>`;
const num=v=>+String(v).replace(/,/g,'')||0;
const fmt=n=>S.cur+' '+(+n).toLocaleString('en-US',{maximumFractionDigits:S.cur==='UGX'?0:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const byNew=(a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||''))||b.id-a.id;
const mtx=()=>S.tx.filter(t=>t.date.startsWith(month)).sort(byNew);
const opts=(a,cur)=>a.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`}).join('');
const bar=(sp,lim,base)=>{const d=lim||base,p=d>0?Math.min(100,sp/d*100):0,c=lim>0?(sp>lim?'over':sp>lim*.8?'warn':''):'';return `<div class="bar ${c}"><i style="width:${p}%"></i></div>`};
// Puts a comma after every 3 digits while you type
function cm(el){const p=el.value.replace(/[^\d.]/g,'').split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');el.value=p.length>1?p[0]+'.'+p[1].slice(0,2):p[0]}
const catLim=c=>+S.budgets[c]||(S.subs[c]||[]).reduce((s,u)=>s+(+S.budgets[c+' › '+u]||0),0);

function st(){const t=mtx(),[y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),now=today().startsWith(month)?+today().slice(8):days,by={},sb={};
 t.forEach(x=>{if(x.type==='expense'){by[x.cat]=(by[x.cat]||0)+x.amt;if(x.sub){const k=x.cat+' › '+x.sub;sb[k]=(sb[k]||0)+x.amt}}});
 const names=[...new Set([...Object.keys(by),...S.cats.expense.filter(c=>catLim(c)>0)])].sort((a,b)=>(by[b]||0)-(by[a]||0)),rows=[];
 names.forEach(c=>{rows.push({n:c,sp:by[c]||0,l:catLim(c)});(S.subs[c]||[]).forEach(u=>{const k=c+' › '+u,sp=sb[k]||0,l=+S.budgets[k]||0;if(sp||l)rows.push({n:k,sp,l})})});
 return{t,days,now,by,rows,exp:sum(t,'expense'),inc:sum(t,'income'),tb:S.cats.expense.reduce((a,c)=>a+catLim(c),0),top:Object.keys(by).sort((a,b)=>by[b]-by[a])[0]}}

const TIPS={
 inc:['Pay yourself first: put part of every income aside for savings as soon as you receive it.','Record every shilling you receive, even small amounts. Small income adds up.','Follow up on money people owe you (Accounts Receivable) on a fixed day each week.','Try to have more than one source of income, for example farming and a small business.','Sell farm produce when prices are good, and store what you can until then.','Record gifts and donations as income so your budget shows the true picture.','Keep 10% to 20% of any income as savings for school fees and emergencies.'],
 exp:['Write down every expense on the same day. What is not recorded is soon forgotten.','Before buying, ask: do I need it, or do I only want it? Wait one day for things that are not urgent.','Buy farm inputs such as seeds and feeds together with other farmers to get a better price.','Compare prices in two shops before buying anything big.','Pay school fees early in the term and in parts, so it does not pile up at once.','Watch the small daily costs like airtime, snacks and transport. They add up every month.','Plan your food shopping with a list to avoid buying what you did not plan for.'],
 bud:['Set a limit for every category in Budgets. A budget without limits is only a record.','Check your budget ring each morning. Below 80% is safe. Above 80%, slow down.','Plan for costs that come once in a while, like school fees, weddings and sadaqa. Spread them across the months.','A simple guide: about 50% for needs, 30% for wants and 20% for savings. Adjust it to your life.','At the end of the month, download the PDF report and use it to adjust next month\'s limits.','Build an emergency fund of at least one month of expenses.','Give every shilling a job: when income arrives, fill your budget boxes straight away.']};
function tips(s){const T=today(),cur=month===T.slice(0,7),dn=Math.floor(new Date(T+'T00:00:00')/864e5),pick=(a,k)=>a[(dn+k)%a.length],f=fmt,
 td=sum(S.tx.filter(x=>x.date===T),'expense'),avg=s.exp/s.now,pc=s.tb?s.exp/s.tb:0,tc=s.rows.find(r=>!r.n.includes('›'));

function del(id){dlg('Delete this entry?',()=>{S.tx=S.tx.filter(x=>x.id!==id);save();render()},'Delete')}
function setB(el){S.budgets[el.dataset.k]=num(el.value);save()}
function addCat(k){const n=$('#nc').value.trim();if(!n)return;if(!S.cats[k].includes(n)){S.cats[k].push(n);save()}render()}

// ---- Assistant (works offline, uses your own records) ----
function answer(q){const s=st(),l=q.toLowerCase(),f=fmt,pc=(a,b)=>b?Math.round(a/b*100)+'%':'0%';
 const names=[...S.cats.expense,...S.cats.income,...Object.values(S.subs).flat(),...Object.values(S.who).flat()].filter(n=>n!=='Other'&&n!=='Others').sort((a,b)=>b.length-a.length);
 const c=names.find(n=>new RegExp('\\b'+rx(n.toLowerCase().split(' (')[0].replace(/s$/,''))+'s?\\b').test(l));
 if(c){const m=s.t.filter(x=>x.cat===c||x.sub===c||x.who===c),o=sum(m,'expense'),i=sum(m,'income');
  return m.length?`${c} in ${month}: ${m.length} entries.`+(o?`\nSpent: ${f(o)} (${pc(o,s.exp)} of all spending)`:'')+(i?`\nReceived: ${f(i)}`:''):`No entries for ${c} in ${month}.`}
 if(/today/.test(l)){const d=s.t.filter(x=>x.date===today());return `Today: spent ${f(sum(d,'expense'))}, received ${f(sum(d,'income'))} (${d.length} entries).`}
 if(/forecast|predict|end of|project/.test(l)){const p=s.exp/s.now*s.days;
  return `Spent so far: ${f(s.exp)} in ${s.now} days (${f(s.exp/s.now)} per day).\nAt this pace you will spend about ${f(p)} by the end of ${month}.`+(s.tb?(p>s.tb?`\nThat is ${f(p-s.tb)} MORE than your budget of ${f(s.tb)}. Slow down.`:`\nThat is within your budget of ${f(s.tb)}.`):'')}
 if(/over|limit|budget|left|remain/.test(l)){if(!s.tb)return 'You have not set any limits yet. Open the Budgets tab and type a limit for each category.';
  const a=s.rows.filter(r=>r.l&&r.sp>r.l).map(r=>`Over: ${r.n} by ${f(r.sp-r.l)}`),b=s.rows.filter(r=>r.l&&r.sp<=r.l&&r.sp>r.l*.8).map(r=>`Close to the limit: ${r.n} (${pc(r.sp,r.l)} used)`);
  return `Total: ${f(s.exp)} of ${f(s.tb)} used (${pc(s.exp,s.tb)}).\n`+([...a,...b].join('\n')||'No category is over its limit. Well done!')}
 if(/big|large|highest|most/.test(l)){const e=s.t.filter(x=>x.type==='expense').sort((a,b)=>b.amt-a.amt).slice(0,3);
  return e.length?'Biggest expenses:\n'+e.map(x=>`${x.date} ${x.cat}${x.sub?' › '+x.sub:''}: ${f(x.amt)}`).join('\n'):'No expenses recorded yet.'}
 if(/save|saving|cut|reduce|tip|advice|improve/.test(l)){if(!s.exp)return 'Record some spending first, then I can give advice.';
  const t=s.rows.filter(r=>!r.n.includes('›'))[0],r=[`Your biggest spending is ${t.n}: ${f(t.sp)} (${pc(t.sp,s.exp)} of expenses). Cutting 10% there saves ${f(t.sp/10)} a month.`];
  if(s.inc&&s.inc>=s.exp&&(s.inc-s.exp)/s.inc<.2)r.push(`You kept only ${pc(s.inc-s.exp,s.inc)} of your income. A good aim is to keep at least 20%.`);
  if(s.inc<s.exp)r.push('You are spending more than you received this month. Delay anything that is not urgent.');
  s.rows.filter(x=>x.l&&x.sp>x.l).forEach(x=>r.push(`Over limit: ${x.n}.`));
  r.push('Tip: record every expense on the same day and set a limit for each category in Budgets.');return r.join('\n')}
 if(/summary|overview|how am i|report|balance|total/.test(l)){const t3=s.rows.filter(r=>!r.n.includes('›')&&r.sp).slice(0,3);
  return `${month}: income ${f(s.inc)}, expenses ${f(s.exp)}, balance ${f(s.inc-s.exp)}.`+(s.inc?`\nYou kept ${pc(s.inc-s.exp,s.inc)} of your income.`:'')+(t3.length?'\nTop spending: '+t3.map(r=>`${r.n} (${f(r.sp)})`).join(', ')+'.':'')}
 return 'I can answer questions about your records, for example:\n• How much did I spend on feeds?\n• Summary\n• Am I over budget?\n• Forecast end of month\n• Where can I save?\n• Biggest expenses'}
function ask(q){q=q.trim();if(!q)return;chat.unshift({q,a:answer(q)});$('#aq').value='';drawChat()}
const drawChat=()=>{$('#chat').innerHTML=chat.map(c=>`<div class=card><b>${esc(c.q)}</b><p class=mut style="white-space:pre-line">${esc(c.a)}</p></div>`).join('')};

// ---- Calculator ----
const CK=['C','⌫','00','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
const OPS='÷×−+';
$('#ck').innerHTML=CK.map(k=>`<button class="${OPS.includes(k)||k==='='?'op':''} ${k==='='?'w':''}" onclick="key('${k}')">${k}</button>`).join('');
function ev(){const e=ex.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\b0+(?=\d)/g,'');
 if(!e||!/^[\d+\-*/.\s]+$/.test(e))return null;try{const r=Function('return '+e)();return isFinite(r)?Math.round(r*1e6)/1e6:null}catch(x){return null}}
function key(k){if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);
 else if(k==='='){const r=ev();if(r!==null)ex=String(r)}
 else if(OPS.includes(k)){if(!ex&&k!=='−')return;if(OPS.includes(ex.slice(-1)))ex=ex.slice(0,-1);ex+=k}
 else ex+=k;
 $('#cdisp').textContent=ex.replace(/\d+(\.\d*)?/g,m=>{const[a,b]=m.split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b!==undefined?'.'+b:'')})||'0';
 const r=ev();$('#cr').textContent=r!==null&&/[÷×−+]/.test(ex.slice(1))?'= '+r.toLocaleString('en-US'):''}
function calc(o){$('#cw').hidden=!o}
function useCalc(){const r=ev(),v=r!==null?r:num(ex);if(!(v>0))return;go('add');$('#amt').value=v.toLocaleString('en-US',{maximumFractionDigits:2});calc(0)}

// ---- PDF (built inside the app, no internet needed) ----
function report(){const s=st(),L=[],p=(a,n)=>String(a).slice(0,n).padEnd(n),r=(a,n)=>String(a).slice(0,n).padStart(n);
 L.push('PERSONAL BUDGET REPORT - '+month,'Created: '+today()+' '+nowT()+'    Currency: '+S.cur,'='.repeat(90),'Income:   '+fmt(s.inc),'Expenses: '+fmt(s.exp),'Balance:  '+fmt(s.inc-s.exp),'Budget:   '+(s.tb?fmt(s.tb):'not set'),'','SPENDING BY CATEGORY',p('Category',34)+r('Spent',20)+r('Limit',20),'-'.repeat(74));
 s.rows.forEach(x=>L.push(p(x.n,34)+r(fmt(x.sp),20)+r(x.l?fmt(x.l):'-',20)));
 L.push('','TRANSACTIONS',p('Date',10)+' '+p('Time',5)+' '+p('',3)+' '+p('Category / item',24)+r('Amount',16)+' Note','-'.repeat(90));
 s.t.forEach(x=>L.push(p(x.date,10)+' '+p(x.time||'',5)+' '+p(x.type==='income'?'IN':'OUT',3)+' '+p(x.cat+(x.sub?' > '+x.sub:''),24)+r(fmt(x.amt),16)+' '+((x.who?'['+x.who+'] ':'')+(x.note||'')).slice(0,28)));
 if(!s.t.length)L.push('No entries this month.');return L}
function mkPdf(lines){const per=60,pages=[];for(let i=0;i<lines.length;i+=per)pages.push(lines.slice(i,i+per));
 const o=[];o[1]='<</Type/Catalog/Pages 2 0 R>>';o[2]=`<</Type/Pages/Kids[${pages.map((_,i)=>(4+i*2)+' 0 R').join(' ')}]/Count ${pages.length}>>`;o[3]='<</Type/Font/Subtype/Type1/BaseFont/Courier>>';
 pages.forEach((p,i)=>{const t='BT /F1 9 Tf 12 TL 40 800 Td '+p.map(l=>'('+l.replace(/›/g,'>').replace(/[^\x20-\x7e]/g,'?').replace(/[\\()]/g,'\\$&')+') Tj T*').join(' ')+' ET';
  o[4+i*2]=`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R>>>>/Contents ${5+i*2} 0 R>>`;o[5+i*2]=`<</Length ${t.length}>>stream\n${t}\nendstream`});
 let out='%PDF-1.4\n';const off=[];for(let i=1;i<o.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+o[i]+'\nendobj\n'}
 const x=out.length;out+='xref\n0 '+o.length+'\n0000000000 65535 f \n'+off.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<</Size '+o.length+'/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF';
 return new Blob([out],{type:'application/pdf'})}
async function doPdf(share){const f=new File([mkPdf(report())],'budget-'+month+'.pdf',{type:'application/pdf'});
 if(share){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'My Budget '+month})}catch(e){}return}
  dlg('Sharing is not available here, so the PDF will download. Open it from your Downloads and share it from there.')}
 dl(f.name,f,'application/pdf')}

// ---- Google Drive auto backup (every 30 minutes while the app is open) ----
let gTok='',gExp=0,gScript=null,gBusy=0,gFail=0;
const gLoad=()=>gScript||(gScript=new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://accounts.google.com/gsi/client';e.onload=ok;e.onerror=()=>{gScript=null;no(new Error('offline'))};document.head.appendChild(e)}));
async function gToken(){if(gTok&&Date.now()<gExp-6e4)return gTok;await gLoad();
 return new Promise((ok,no)=>{const c=google.accounts.oauth2.initTokenClient({client_id:G.cid,scope:'https://www.googleapis.com/auth/drive.file',
  callback:r=>{if(r.error)return no(new Error(r.error));gTok=r.access_token;gExp=Date.now()+r.expires_in*1e3;ok(gTok)},error_callback:e=>no(new Error('popup '+(e.type||'')))});
  c.requestAccessToken({prompt:G.ok?'':'consent'})})}
async function gSend(retry){const t=await gToken(),bd='bnd'+Date.now(),meta=G.fid?{}:{name:'my-budget-backup.json',mimeType:'application/json'},
 mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${bd}--`,
 r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(G.fid?'/'+G.fid:'')+'?uploadType=multipart',{method:G.fid?'PATCH':'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'multipart/related; boundary='+bd},body:mp});
 if(r.status===401&&!retry){gTok='';return gSend(1)}
 if(r.status===404&&G.fid&&!retry){G.fid='';return gSend(1)}
 if(!r.ok)throw new Error('Drive '+r.status);G.fid=(await r.json()).id}
const gMsg=e=>/offline|Failed to fetch|NetworkError/i.test(e.message)?'No internet connection.':/popup|access_denied|closed/i.test(e.message)?'Google sign-in was cancelled or blocked.':/Drive 403/.test(e.message)?'Google Drive is not switched on for your project (setup step 3).':'Backup failed ('+e.message+'). Check your Client ID and internet.';
async function gBackup(auto){if(gBusy)return;
 if(!S.tx.length&&!S.journal.length){if(!auto)dlg('There is nothing to back up yet. Add an entry first.');return}
 gBusy=1;try{await gSend();G.on=1;G.ok=1;G.d=0;G.last=Date.now();G.err='';gFail=0;if(!auto)dlg('Backup saved to your Google Drive ✔')}
 catch(e){gFail=Date.now();if(auto)G.err=gMsg(e)+' Tap Back up now.';else dlg(gMsg(e))}
 finally{gBusy=0;saveG();if(tab==='more'||(tab==='home'&&G.err))render()}}
function gConnect(){const c=$('#gcid').value.trim();if(!/\.apps\.googleusercontent\.com$/.test(c))return dlg('Please paste the full Client ID. It ends with .apps.googleusercontent.com');
 if(c!==G.cid){G.fid='';gTok='';G.ok=0}G.cid=c;saveG();gBackup(0)}
async function gRestore(){const i=$('#gcid');if(i&&i.value.trim()&&i.value.trim()!==G.cid){G.cid=i.value.trim();G.fid='';gTok='';G.ok=0}
 if(!G.cid)return dlg('Paste your Google Client ID first.');
 try{const t=await gToken(),h={headers:{Authorization:'Bearer '+t}};
  if(!G.fid){const r=await(await fetch('https://www.googleapis.com/drive/v3/files?orderBy=modifiedTime%20desc&fields=files(id)&q='+encodeURIComponent("name='my-budget-backup.json' and trashed=false"),h)).json();
   if(!r.files||!r.files.length)return dlg('No backup was found in your Google Drive yet.');G.fid=r.files[0].id}
  const d=await(await fetch('https://www.googleapis.com/drive/v3/files/'+G.fid+'?alt=media',h)).json();if(!Array.isArray(d.tx))throw new Error('format');
  dlg('Replace the data on this phone with your Google Drive backup?',()=>{S=norm(d);save();G.on=1;G.ok=1;G.d=0;G.last=Date.now();G.err='';saveG();render();dlg('Backup restored ✔')},'Restore')}
 catch(e){dlg(/format/.test(e.message)?'That Drive file is not a valid backup.':gMsg(e))}}
function gTick(){if(!G.on||!G.d||gBusy||!navigator.onLine)return;const n=Date.now();if(n-(G.last||0)<18e5||(gFail&&n-gFail<18e5))return;gBackup(1)}
const gBanner=()=>G.on&&G.err?`<div class=card style="border-left:4px solid var(--warn)"><b>☁️ Google Drive backup paused</b><p class=mut>${esc(G.err)}</p><button class=btn onclick="gBackup(0)">Back up now</button></div>`:'';
const gCard=()=>`<div class=card><h3>☁️ Google Drive backup</h3>`+(G.on?
 `<p class=mut>✅ Auto backup is ON. While the app is open, a copy is saved to your Google Drive every 30 minutes if something changed.<br>Last backup: ${G.last?new Date(G.last).toLocaleString('en-GB'):'not yet'}</p>${G.err?`<p class=mut style="color:var(--exp)">${esc(G.err)}</p>`:''}
 <button class=btn onclick="gBackup(0)">Back up now</button><button class="btn ghost" onclick="gRestore()">Restore from Google Drive</button><button class="btn red" onclick="G.on=0;saveG();render()">Turn off auto backup</button>`:
 `<p class=mut>Paste your Google Client ID, then tap Connect.</p><label>Google Client ID<input id=gcid value="${esc(G.cid||'')}" placeholder="123-abc.apps.googleusercontent.com"></label>
 <button class=btn onclick="gConnect()">Connect Google Drive</button><button class="btn ghost" onclick="gRestore()">Restore from Google Drive</button>`)+`</div>`;

// ---- Data tools ----
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function csv(){const r=[['Date','Time','Type','Category','Item','Amount','Note'],...S.tx.map(t=>[t.date,t.time||'',t.type,t.cat,t.sub||'',t.amt,t.note])];
 dl('budget.csv',r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
const backup=()=>dl('budget-backup-'+today()+'.json',JSON.stringify(S),'application/json');
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;S=norm(d);save();render();dlg('Backup restored ✔')}catch(e){dlg('That file is not a valid backup.')}};r.readAsText(f)}
function wipe(){dlg('Delete ALL entries and budgets? This cannot be undone.',()=>{S=norm();save();render()},'Delete all')}
function install(){inst.prompt();inst=null;render()}

setInterval(gTick,6e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden)gTick()});addEventListener('online',gTick);setTimeout(gTick,4000);
$('#month').onchange=e=>{month=e.target.value||month;render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(tab==='more')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
