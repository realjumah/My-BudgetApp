<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Budget</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--tx:#14211f;--mut:#5b6b68;--pri:#0f766e;--on:#fff;--inc:#15803d;--exp:#c2410c;--warn:#b45309;--bd:#d9e3e1}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17211f;--tx:#e6efed;--mut:#93a5a1;--pri:#2dd4bf;--on:#06201c;--inc:#4ade80;--exp:#fb923c;--warn:#fbbf24;--bd:#2a3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
button{font-family:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--on);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}
header input{width:auto;margin:0;padding:6px 8px}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.mut{color:var(--mut);font-size:14px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:15px}.grid span{font-size:12px;color:var(--mut)}
.inc{color:var(--inc)}.exp{color:var(--exp)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0}
input,select{width:100%;margin-top:4px;padding:11px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.btn{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:var(--pri);color:var(--on);font-weight:600;font-size:16px;cursor:pointer}
.btn.ghost{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn.red{background:none;color:var(--exp);border:1px solid var(--exp)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.seg button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.row{display:flex;gap:8px}
.cat{margin:12px 0}.cat div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pri)}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--exp)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}.tx small{display:block;color:var(--mut)}
.tx button{background:none;border:0;color:var(--mut);font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0;border:0;background:none;color:var(--mut);font-size:11px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
</style>
</head>
<body>
<header><h1>💰 My Budget</h1><input type="month" id="month" aria-label="Month"></header>
<main id="view"></main>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>Home</button>
<button data-t="add" onclick="go('add')"><span>➕</span>Add</button>
<button data-t="history" onclick="go('history')"><span>📋</span>History</button>
<button data-t="budgets" onclick="go('budgets')"><span>🎯</span>Budgets</button>
<button data-t="more" onclick="go('more')"><span>⚙️</span>More</button>
</nav>
<script>
const K='budget-pwa-v1',$=s=>document.querySelector(s);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DEF={cur:'UGX',tx:[],budgets:{},cats:{
  expense:['Food','Transport','Rent','Airtime & Data','Health','School Fees','Business','Savings','Entertainment','Other'],
  income:['Salary','Business','Farming','Gift','Other']}};
let S;try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(K))||{})}catch(e){S=structuredClone(DEF)}
let tab='home',month=today().slice(0,7),addType='expense',flt='all',inst=null;

const save=()=>localStorage.setItem(K,JSON.stringify(S));
const fmt=n=>S.cur+' '+(+n).toLocaleString(undefined,{maximumFractionDigits:S.cur==='UGX'?0:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const mtx=()=>S.tx.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const bar=(sp,lim,base)=>{const d=lim||base,p=d>0?Math.min(100,sp/d*100):0,c=lim>0?(sp>lim?'over':sp>lim*.8?'warn':''):'';
  return `<div class="bar ${c}"><i style="width:${p}%"></i></div>`};

const V={
home(){
  const t=mtx(),inc=sum(t,'income'),exp=sum(t,'expense'),[y,m]=month.split('-').map(Number);
  const days=new Date(y,m,0).getDate(),now=today().startsWith(month)?+today().slice(8):days;
  const by={};t.forEach(x=>{if(x.type==='expense')by[x.cat]=(by[x.cat]||0)+x.amt});
  const names=[...new Set([...Object.keys(by),...S.cats.expense.filter(c=>S.budgets[c]>0)])].sort((a,b)=>(by[b]||0)-(by[a]||0));
  const tb=S.cats.expense.reduce((s,c)=>s+(+S.budgets[c]||0),0),top=Object.keys(by).sort((a,b)=>by[b]-by[a])[0];
  return `<div class=card><div class=grid>
    <div><span>Income</span><b class=inc>${fmt(inc)}</b></div>
    <div><span>Expenses</span><b class=exp>${fmt(exp)}</b></div>
    <div><span>Balance</span><b>${fmt(inc-exp)}</b></div></div></div>
  <div class=card><h3>Total budget</h3>${tb?`<div class=mut>${fmt(exp)} of ${fmt(tb)} used (${Math.round(exp/tb*100)}%)</div>${bar(exp,tb)}
    <p class=mut>${tb>=exp?fmt(tb-exp)+' left to spend':'Over budget by '+fmt(exp-tb)}</p>`:'<p class=mut>No budget yet. Open Budgets to set a limit for each category.</p>'}</div>
  <div class=card><h3>Quick facts</h3><p class=mut>Saved: ${inc?Math.round((inc-exp)/inc*100)+'% of income':'no income recorded'}<br>
    Average spent per day: ${fmt(exp/now)}<br>Biggest spending: ${top?esc(top)+' ('+fmt(by[top])+')':'none yet'}<br>Entries this month: ${t.length}</p></div>
  <div class=card><h3>Spending by category</h3>${names.length?names.map(c=>{const sp=by[c]||0,l=+S.budgets[c]||0;
    return `<div class=cat><div><span>${esc(c)}</span><span>${fmt(sp)}${l?' / '+fmt(l):''}</span></div>${bar(sp,l,exp)}</div>`}).join(''):'<p class=mut>Nothing yet. Tap Add to record your first expense.</p>'}</div>`},

add(){return `<div class=card><div class=seg><button id=bE onclick="setType('expense')">Expense</button><button id=bI onclick="setType('income')">Income</button></div>
  <label>Amount (${S.cur})<input id=amt type=number inputmode=decimal min=0 placeholder="0"></label>
  <label>Category<select id=cat></select></label>
  <label>Date<input id=date type=date value="${today()}"></label>
  <label>Note (optional)<input id=note maxlength=80 placeholder="e.g. Vegetables at the market"></label>
  <button class=btn onclick="addTx()">Save entry</button><p id=msg class=mut></p></div>`},

history(){const t=mtx().filter(x=>flt==='all'||x.type===flt);
  return `<div class=card><select onchange="flt=this.value;render()">${[['all','All entries'],['expense','Expenses only'],['income','Income only']].map(o=>`<option value=${o[0]} ${o[0]===flt?'selected':''}>${o[1]}</option>`).join('')}</select>
  ${t.length?t.map(x=>`<div class=tx><div><b>${esc(x.cat)}</b><small>${x.date}${x.note?' · '+esc(x.note):''}</small></div>
    <b class=${x.type==='income'?'inc':'exp'}>${x.type==='income'?'+':'−'}${fmt(x.amt)}</b><button onclick="del(${x.id})" aria-label="Delete entry">🗑</button></div>`).join(''):'<p class=mut>No entries for this month. Tap Add to create one.</p>'}</div>`},

budgets(){return `<div class=card><h3>Monthly limits</h3><p class=mut>Type the most you plan to spend on each category every month. Leave empty for no limit.</p>
  ${S.cats.expense.map((c,i)=>`<label>${esc(c)}<input type=number inputmode=decimal min=0 value="${S.budgets[c]||''}" onchange="setB(${i},this.value)"></label>`).join('')}</div>
  <div class=card><h3>Add your own category</h3><label>Name<input id=nc maxlength=24 placeholder="e.g. Church giving"></label>
  <div class=row><button class=btn onclick="addCat('expense')">Add expense</button><button class="btn ghost" onclick="addCat('income')">Add income</button></div></div>`},

more(){return `<div class=card><h3>Currency</h3><select onchange="S.cur=this.value;save()">${['UGX','KES','TZS','RWF','USD','EUR','GBP'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class=card><h3>Your data</h3><p class=mut>Everything is saved only on this phone. Save a backup often.</p>
  <button class=btn onclick="csv()">Download Excel (CSV) file</button><button class="btn ghost" onclick="backup()">Save backup file</button>
  <label>Restore from a backup file<input type=file accept=".json" onchange="restore(this)"></label></div>
  <div class=card><h3>Install</h3>${inst?'<button class=btn onclick="install()">Install this app</button>':'<p class=mut>Android Chrome: menu ⋮ then Install app.<br>iPhone Safari: Share then Add to Home Screen.</p>'}</div>
  <div class=card><button class="btn red" onclick="wipe()">Delete all data</button></div>`}
};

function render(){
  $('#month').value=month;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#view').innerHTML=V[tab]();
  if(tab==='add')setType(addType);
}
const go=t=>{tab=t;render();scrollTo(0,0)};
const msg=(t)=>{$('#msg').textContent=t};
function setType(t){addType=t;$('#bE').classList.toggle('on',t==='expense');$('#bI').classList.toggle('on',t==='income');
  $('#cat').innerHTML=S.cats[t].map(c=>`<option>${esc(c)}</option>`).join('')}
function addTx(){const a=+$('#amt').value;
  if(!(a>0))return msg('Please type an amount above 0.');
  S.tx.push({id:Date.now(),type:addType,amt:a,cat:$('#cat').value,date:$('#date').value||today(),note:$('#note').value.trim()});
  save();$('#amt').value=$('#note').value='';msg('Saved ✔ You can add another entry.')}
function del(id){if(confirm('Delete this entry?')){S.tx=S.tx.filter(x=>x.id!==id);save();render()}}
function setB(i,v){S.budgets[S.cats.expense[i]]=+v||0;save()}
function addCat(k){const n=$('#nc').value.trim();if(!n)return;if(!S.cats[k].includes(n)){S.cats[k].push(n);save()}render()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(){const r=[['Date','Type','Category','Amount','Note'],...S.tx.map(t=>[t.date,t.type,t.cat,t.amt,t.note])];
  dl('budget.csv',r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
const backup=()=>dl('budget-backup-'+today()+'.json',JSON.stringify(S),'application/json');
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;S=Object.assign(structuredClone(DEF),d);save();render();alert('Backup restored ✔')}
  catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
function wipe(){if(confirm('Delete ALL entries and budgets? This cannot be undone.')){S=structuredClone(DEF);save();render()}}
function install(){inst.prompt();inst=null;render()}

$('#month').onchange=e=>{month=e.target.value||month;render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(tab==='more')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
